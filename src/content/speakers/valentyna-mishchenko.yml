slug: valentyna-mishchenko
name:
  uk: Міщенко Валентина Павлівна
  en: Valentyna Mishchenko
position:
  uk: Заслужений діяч науки і техніки України, д.мед.н., професор кафедри
    акушерства та гінекології ОНМедУ
  en: Honored Worker of Science and Technology of Ukraine, Doctor of Medical
    Sciences, Professor at the Department of Obstetrics and Gynecology of Odesa
    National Medical University
biography:
  uk: >-
    Науковий напрямок – предиктивна медицина


    Автор понад 150 наукових публікацій, монографій «Антропогенно залежні стани в акушерстві та перинатології» (2001), історичного нарису «Біля витоків життя» (2002),навчальних посібників «Акушерська патологія: Атлас» (2005), «Акушерство і гінекологія: Збірник тестових завдань за клінічними рисунками» (2008), співавтор підручників з акушерства і гінекології (2007, 2007); автор історико–біографічного нарису «Син свого народу» (2015), монографії «Долею дано» (2021), практичних рекомендацій, інформаційних листів, патентів на винахід, науковий керівний, науковий консультант дисертаційних робіт, науковий керівник лікарів–магістрів, клінічних ординаторів, аспірантів
  en: >-
    Scientific focus: predictive medicine.


    Author of more than 150 scientific publications, the monograph “Anthropogenically Dependent Conditions in Obstetrics and Perinatology” (2001), the historical essay “At the Origins of Life” (2002), study guides including “Obstetric Pathology: Atlas” (2005) and “Obstetrics and Gynecology: Collection of Test Tasks Based on Clinical Images” (2008), and co-author of obstetrics and gynecology textbooks.


    Author of the historical and biographical essay “Son of His People” (2015), the monograph “Given by Fate” (2021), practical recommendations, information letters, and invention patents. Scientific supervisor and consultant for dissertation work, and scientific supervisor of master physicians, clinical residents, and postgraduate students.
