  en: Yurii Petrovskyi
position:
  uk: к.мед.н., лікар уролог вищої категорії
  en: Candidate of Medical Sciences, highest-category urologist
biography:
  uk: 'Петровський Юрій Юрійович


    - к.мед.н., лікар уролог вищої категорії.

    - Стаж роботи 17років. Автор 49 наукових публікацій.

    - У 2011 році захистив дисертацію на тему «Обґрунтування та вибір методу хірургічного лікування жінок, хворих на генітальний пролапс у сполученні з нетриманням сечі при напрузі».

    - Працює у Багатопрофільному медичному центрі Одеського національного медичного університету з 2008 року.

    -

    Напрямок досліджень:

    урогінекологічні захворювання, розлади сечовипускання, уродинамічні дослідження.'
  en: 'He has 17 years of work experience and is the author of 49 scientific publications.


    In 2011, he defended his dissertation on the substantiation and selection of surgical treatment methods for women with genital prolapse combined with stress urinary incontinence.


    He has worked at the Multidisciplinary Medical Center of Odesa National Medical University since 2008.


    Research focus: urogynecological diseases, urinary disorders, and urodynamic studies.'
