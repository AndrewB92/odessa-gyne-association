biography:
  uk: ''' Рожковська Наталя Миколаївна – доктор медичних наук, професор кафедри акушерства та гінекології Одеського національного медичного університету. Є членом Всесвітньої Асоціації акушерів-гінекологів, Української асоціації лікарів з малоінвазивної та ендоскопічної хірургії, Європейської асоціації гінекологів-онкологів, Європейської асоціації гінекологів-ендоскопістів, Української асоціації акушерів-гінекологів, гінекологів-ендокринологів, співголовою Одеського відділення Української асоціації з кольпоскопії та цервікальної патології. Автор понад 300 наукових праць, з яких 3 монографії, 6 підручників та навчальних посібників, 15 методичних рекомендацій та інформаційних листів МОЗ України, близько 50 патентів на винахід.


    Проф. Рожковська Н.М. - голова спеціалізованої вченої ради з захисту докторських дисертацій Одеського національного медичного університету. Нею підготовлено 15 кандидатів медичних наук, 1 доктор медичних наук. Нагороджена медаллю «За трудову доблесть».'
  en: 'Member of the World Association of Obstetricians and Gynecologists, the Ukrainian Association of Minimally Invasive and Endoscopic Surgery, the European Society of Gynecological Oncology, the European Society for Gynecological Endoscopy, the Ukrainian Association of Obstetricians and Gynecologists, and the Association of Gynecological Endocrinologists. Co-chair of the Odesa branch of the Ukrainian Association of Colposcopy and Cervical Pathology.


    Author of more than 300 scientific works, including 3 monographs, 6 textbooks and study guides, 15 methodological recommendations and information letters of the Ministry of Health of Ukraine, and about 50 invention patents.


    Professor Rozhkovska is the chair of the specialized academic council for the defense of doctoral dissertations at Odesa National Medical University. She has supervised 15 Candidates of Medical Sciences and 1 Doctor of Medical Sciences. She was awarded the Medal “For Labor Valor”.'
