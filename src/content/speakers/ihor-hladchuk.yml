name:
  uk: Гладчук Ігор Зіновійович
  en: Ihor Hladchuk
position:
  uk: завідуючий кафедрою акушерства та гінекології ОНМедУ, д.мед.н., професор
  en: Head of the Department of Obstetrics and Gynecology at Odesa National Medical University, Doctor of Medical Sciences, Professor
biography:
  uk: 'Гладчук Ігор Зіновійович,

    завідуючий кафедрою акушерства та гінекології ОНМедУ,

    д.мед.н., професор.


    З 1993 року - секретар Української асоціації лікарів з гінекологічної ендоскопії;

    З 1998 року і по теперішній час – секретар гінекологічної секції Української асоціації лікарів з малоінвазивних ендоскопічних і лазерних технологій;

    Голова організаційного комітету І-VІІ Всеукраїнських конференцій з участю міжнародних експертів з ендоскопічної та інноваційної хірургії в гінекології.

    З 2010 року - член Європейського товариства онкогінекологів;

    В 2015 році - почесний член Польського товариства гінекологів;

    З 2016 року - член президії ГО «Асоціації акушерів-гінекологів України»;

    В 2017 році - почесний член товариства репродуктологів Угорщини;


    У серпні 2009 року нагороджений орденом «За заслуги» ІІІ ступеня;

    30 років стажу роботи на кафедрах медичного університету та лікарська діяльність більше 35 років.


    Автор 193 наукових публікацій, 5 монографій та 25 патентів на винахід.'
  en: 'Since 1993, Secretary of the Ukrainian Association of Doctors in Gynecological Endoscopy.

    Since 1998, Secretary of the Gynecological Section of the Ukrainian Association of Doctors in Minimally Invasive Endoscopic and Laser Technologies.

    Chairman of the organizing committee of the 1st–7th All-Ukrainian conferences with international experts on endoscopic and innovative surgery in gynecology.

    Since 2010, member of the European Society of Gynecological Oncology.

    In 2015, honorary member of the Polish Society of Gynecologists.

    Since 2016, member of the Presidium of the NGO “Association of Obstetricians and Gynecologists of Ukraine”.

    In 2017, honorary member of the Hungarian Society of Reproductive Medicine.


    In August 2009, he was awarded the Order of Merit, 3rd class.

    He has 30 years of experience working at medical university departments and more than 35 years of clinical practice.


    Author of 193 scientific publications, 5 monographs, and 25 invention patents.'
