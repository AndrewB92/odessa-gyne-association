slug: oleksandr-protsepko
name:
  uk: Процепко Олександр Олексійович
  en: Oleksandr Protsepko
position:
  uk: начальник відділення гінекології Військово-медичного центру Повітряних сил ЗС України; д.мед.н., професор кафедри акушерства та гінекології №1 ВНМУ ім. М.І. Пирогова; лікар акушер-гінеколог вищої категорії
  en: Head of the Gynecology Department of the Military Medical Center of the Air Force of the Armed Forces of Ukraine; Doctor of Medical Sciences, Professor at the Department of Obstetrics and Gynecology No. 1 of Vinnytsia National Pirogov Memorial Medical University; highest-category obstetrician-gynecologist
biography:
  uk: 'Процепко Олександр Олексійович,

    начальник відділення гінекології Військово-Медичного центру Повітряних сил ЗС України,

    д.мед.н., професор кафедри акушерства та гінекології №1 Вінницького національного медичного університету ім. М.І. Пирогова; лікар акушер-гінеколог вищої категорії


    Автор більше 40 друкованих робіт в фахових журналах, 3 монографій, 2 патентів на винаходи.

    Приймав участь з доповідями у багатьох наукових конференціях, з’їздах та семінарах.

    Розроблені новітні методи оперативного лікування генітального пролапсу, які впроваджуються в гінекологічних стаціонарах Вінницької області та за її межами.'
  en: 'Author of more than 40 printed works in professional journals, 3 monographs, and 2 invention patents.


    He has presented at many scientific conferences, congresses, and seminars.


    He has developed modern methods of surgical treatment for genital prolapse, which are implemented in gynecological hospitals in Vinnytsia region and beyond.'
