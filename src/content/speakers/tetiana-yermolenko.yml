biography:
  uk: >-
    e-mail: ErmolenkoTA@ukr.net


    Загальна інформація:

    • 42 р. лікарьского досвіду, вища категорія

    • 37 р. наукового та педагогічного досвіду

    • 1989 р.: к.мед.н., тема дисертації «Kлiнiко-гормональнi взаемовiдношення при гiперпролактнемiї у жiнок з безпліддям».

    • 2008 р.: д.мед.н., тема дисертації «Прогнозування, діагностика, лікування гіпофункції яєчників»


    Додаткова інформація:

    Член спеціалізованої вченої ради Д 41.600.02 з присудження наукового ступеня доктора наук, профіль ради: 14.01.01 «Акушерство та гінекологія», ОНМедУ.

    Член редакційної колегії International scientific journal LABORATORY Diagnostics Eastern Europe.

    Член Асоціації акушерів-гінекологів України та Міжнародної федерації акушерів-гінекологів (FIGO), Асоціації гінекологов - єндокринологів України,

    Української Асоціації кольпоскопії та цервікальної патології,

    Української асоціації остеопороза та Европейської асоціації менопаузи, андропаузи, захворювань кістково-м язовоі системи.


    Інформація про науковця:

    ORCID:T.Yermolenko Т: http: orcid.org/ORCID: 0000-0002-2806-7376

    Автор більше 170 наукових статей та методичних рекомендацій, 4 посiбників (1 англ. мов.), 1 монографії, 12 патентів на винахід.


    Сфера наукових інтересів:

    гінекологія, єндокринологія, ін.
  en: >-
    General information:

    • 42 years of clinical experience, highest qualification category.

    • 37 years of scientific and teaching experience.

    • 1989: Candidate of Medical Sciences thesis on clinical and hormonal relationships in hyperprolactinemia in women with infertility.

    • 2008: Doctor of Medical Sciences thesis on prediction, diagnosis, and treatment of ovarian hypofunction.


    Additional information:

    Member of the specialized academic council D 41.600.02 for awarding the degree of Doctor of Sciences in Obstetrics and Gynecology at Odesa National Medical University.

    Member of the editorial board of the International Scientific Journal Laboratory Diagnostics Eastern Europe.

    Member of the Association of Obstetricians and Gynecologists of Ukraine, FIGO, the Association of Gynecological Endocrinologists of Ukraine, the Ukrainian Association of Colposcopy and Cervical Pathology, the Ukrainian Osteoporosis Association, and the European Menopause and Andropause Society.


    Author of numerous scientific publications and professional materials.
