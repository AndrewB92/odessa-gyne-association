biography:
  uk: 'Гульсим Манасова,


    Заслужений лікар України


    д.м.н., професор


    кафедри акушерства та гінекології


    Одеського національного медичного університету


    e-mail:

    gulsymmanasova@gmail.com


    Загальна інформація

    :

    • 37 р. лікарьского досвіду, вища категорія

    • 32 р. наукового та 22 р. педагогічного досвіду

    • 10 р. навичок організатора охорони здоров’я.

    • 2000 р.: к.мед.н., тема «Патогенетичні основи формування, розвитку та лікування фето-плацентарної недостатності».

    • 2013 р.: д.мед.н., тема «Патогенетичні механізми формування, профілактика та лікування кісткової патології у вагітних з перинатальною інфекцією»


    Додаткова інформація

    :

    - Експерт НСЗУ з розробки проекту специфікацій та умов закупівлі медичних послуг за Програмою медичних гарантій у сфері «Вагітність та пологи» на 2022 рік.

    - Голова Президії Одеського відділення Асоціації акушерів- гінекологів України

    - Член редколегії журналу «ВІСНИК МОРСЬКОЇ МЕДИЦИНИ» МОЗ України, ДП УкрНДІ медицини на транспорті та ЦСЭС на водному транспорті

    - Рецензент журналу «Clinical Medicine Research (CMR Journal)», науково-видавничої групи SPG, США.

    - Член Вченої ради факультету післядипломної освіти ОНМедУ

    - Член Асоціації акушерів і гінекологів України, Європейської Асоціації акушерів і гінекологів (EBCOG); Української асоціації остеопорозу; Президії Українського відділення Європейської асоціації вітаміну D (EVIDAS), Міжнародної асоціації остеопорозу (IOF).


    Інформація про науковця

    :

    ORCID: G. Manasova: http: orcid.org/0000-0002-1600-5215.

    Web of Science Researcher ID:

    Z-1550-2018

    .

    Author ID Scopus : 57202890643

    Google Scholar: sFNxJxkAAAAJ&hl=uk


    Публікації:

    Автор 140 наукових статей, 4 монографій, 9 методичних рекомендацій, 20 патентів на винахід.


    Сфера наукових інтересів:

    перинатальна медицина, невідкладне акушерство, перинатальна інфекція, омік технології в акушерстві та гінекології та ін.'
  en: 'General information:

    • 37 years of clinical experience, highest qualification category.

    • 32 years of scientific experience and 22 years of teaching experience.

    • 10 years of healthcare management experience.

    • 2000: Candidate of Medical Sciences thesis on pathogenetic foundations of the formation, development, and treatment of fetoplacental insufficiency.

    • 2013: Doctor of Medical Sciences thesis on pathogenetic mechanisms of formation, prevention, and treatment of bone pathology in pregnant women with perinatal infection.


    Additional information:

    Expert of the National Health Service of Ukraine on the development of draft specifications and procurement conditions for medical services under the Medical Guarantees Program in “Pregnancy and Childbirth” for 2022.

    Chair of the Presidium of the Odesa Branch of the Association of Obstetricians and Gynecologists of Ukraine.

    Member of the editorial board of the journal “Bulletin of Marine Medicine” of the Ministry of Health of Ukraine.

    Reviewer for the journal Clinical Medicine Research, Science Publishing Group, USA.

    Member of the Academic Council of the Faculty of Postgraduate Education at Odesa National Medical University.

    Member of the Association of Obstetricians and Gynecologists of Ukraine and other professional societies.'
