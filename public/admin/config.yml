          - raw

      - label: "English content"
        name: "bodyEn"
        widget: "markdown"
        required: false
        buttons:
          - bold
          - italic
          - code
          - link
          - heading-two
          - heading-three
          - bulleted-list
          - numbered-list
          - quote
        editor_components:
          - image
        modes:
          - rich_text
          - raw

      - label: "Featured"
        name: "featured"
        widget: "boolean"
