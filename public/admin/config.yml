                value: "external-link"

              - label: "Map"
                value: "map"

              - label: "Calendar"
                value: "calendar"

              - label: "Registration"
                value: "user-plus"

              - label: "Document"
                value: "file-text"

              - label: "Download"
                value: "download"

              - label: "Programme"
                value: "list"

              - label: "Presentation"
                value: "presentation"

              - label: "Test"
                value: "clipboard-check"

              - label: "Certificate"
                value: "certificate"

              - label: "Video"
                value: "video"

              - label: "YouTube"
                value: "youtube"

