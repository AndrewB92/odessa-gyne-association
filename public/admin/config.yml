backend:
  name: github
  repo: AndrewB92/odessa-gyne-association
  branch: main
  base_url: https://odessa-gyne-association.pages.dev
  auth_endpoint: /api/auth

media_folder: "src/assets/speakers"
public_folder: "/src/assets/speakers"

collections:
  - name: "speakers"
    label: "Speakers"
    folder: "src/content/speakers"
    create: true
    delete: true
    extension: "yml"
    format: "yml"
    slug: "{{fields.name.en}}"
    fields:
      - label: "Name"
        name: "name"
        widget: "object"
        fields:
          - { label: "Ukrainian", name: "uk", widget: "string" }
          - { label: "English", name: "en", widget: "string" }

      - label: "Position"
        name: "position"
        widget: "object"
        fields:
          - { label: "Ukrainian", name: "uk", widget: "string" }
          - { label: "English", name: "en", widget: "string" }

      - label: "Biography"
        name: "biography"
        widget: "object"
        fields:
          - { label: "Ukrainian", name: "uk", widget: "text" }
          - { label: "English", name: "en", widget: "text" }

      - { label: "Photo", name: "photo", widget: "image", required: false }
      - { label: "Sort order", name: "sort", widget: "number", default: 10 }