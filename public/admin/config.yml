backend:
  name: github
  repo: AndrewB92/odessa-gyne-association
  branch: main
  base_url: https://odessa-gyne-association.pages.dev
  auth_endpoint: /api/auth

media_folder: "public/uploads/speakers"
public_folder: "/uploads/speakers"

collections:
  - name: "speakers"
    label: "Speakers"
    label_singular: "Speaker"
    folder: "src/content/speakers"
    create: true
    delete: true
    extension: "yml"
    format: "yml"
    identifier_field: "name.en"
    summary: "{{name.en}}"
    slug: "{{slug}}"
    fields:
      - label: "Slug"
        name: "slug"
        widget: "string"
        hint: "URL-safe speaker ID, for example: olena-petrenko"

      - label: "Name"
        name: "name"
        widget: "object"
        fields:
          - label: "Ukrainian"
            name: "uk"
            widget: "string"
          - label: "English"
            name: "en"
            widget: "string"

      - label: "Position"
        name: "position"
        widget: "object"
        fields:
          - label: "Ukrainian"
            name: "uk"
            widget: "string"
          - label: "English"
            name: "en"
            widget: "string"

      - label: "Biography"
        name: "biography"
        widget: "object"
        fields:
          - label: "Ukrainian"
            name: "uk"
            widget: "markdown"
            buttons:
              - bold
              - italic
              - bulleted-list
              - numbered-list
              - link
            editor_components: []
            modes:
              - rich_text
              - raw

          - label: "English"
            name: "en"
            widget: "markdown"
            buttons:
              - bold
              - italic
              - bulleted-list
              - numbered-list
              - link
            editor_components: []
            modes:
              - rich_text
              - raw

      - label: "Photo"
        name: "photo"
        widget: "image"
        required: false

      - label: "Sort order"
        name: "sort"
        widget: "number"
        default: 10
        value_type: "int"