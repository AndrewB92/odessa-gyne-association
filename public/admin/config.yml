      - label: "SEO description"
        name: "seoDescription"
        widget: "object"
        required: false
        fields:
          - label: "Ukrainian"
            name: "uk"
            widget: "text"
            required: false

          - label: "English"
            name: "en"
            widget: "text"
            required: false

  - name: "bprEvents"
