backend:
  name: github
  repo: AndrewB92/odessa-gyne-association
  branch: main
  base_url: https://odessa-gyne-association.pages.dev
  auth_endpoint: /api/auth

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "speakers"
    label: "Speakers"
    label_singular: "Speaker"
    folder: "src/content/speakers"
    create: true
    delete: true
    extension: "yml"
    format: "yml"
    identifier_field: "name.en"
    summary: "{{name.en}}"
    slug: "{{slug}}"
    media_folder: "public/uploads/speakers"
    public_folder: "/uploads/speakers"
    fields:
      - label: "Slug"
        name: "slug"
        widget: "string"
        hint: "URL-safe speaker ID, for example: olena-petrenko"

      - label: "Name"
        name: "name"
        widget: "object"
        fields:
          - label: "Ukrainian"
            name: "uk"
            widget: "string"
          - label: "English"
            name: "en"
            widget: "string"

      - label: "Position"
        name: "position"
        widget: "object"
        fields:
          - label: "Ukrainian"
            name: "uk"
            widget: "string"
          - label: "English"
            name: "en"
            widget: "string"

      - label: "Biography"
        name: "biography"
        widget: "object"
        fields:
          - label: "Ukrainian"
            name: "uk"
            widget: "markdown"
            buttons:
              - bold
              - italic
              - bulleted-list
              - numbered-list
              - link
            editor_components: []
            modes:
              - rich_text
              - raw

          - label: "English"
            name: "en"
            widget: "markdown"
            buttons:
              - bold
              - italic
              - bulleted-list
              - numbered-list
              - link
            editor_components: []
            modes:
              - rich_text
              - raw

      - label: "Photo"
        name: "photo"
        widget: "image"
        required: false

      - label: "Sort order"
        name: "sort"
        widget: "number"
        default: 10
        value_type: "int"

  - name: "newsCategories"
    label: "News Categories"
    label_singular: "News Category"
    folder: "src/content/news-categories"
    create: true
    delete: true
    extension: "yml"
    format: "yml"
    identifier_field: "title.en"
    summary: "{{title.en}}"
    slug: "{{slug}}"
    fields:
      - label: "Slug"
        name: "slug"
        widget: "string"
        hint: "Stable URL-safe category ID, for example: events"

      - label: "Title"
        name: "title"
        widget: "object"
        fields:
          - label: "Ukrainian"
            name: "uk"
            widget: "string"
          - label: "English"
            name: "en"
            widget: "string"

      - label: "Description"
        name: "description"
        widget: "object"
        required: false
        fields:
          - label: "Ukrainian"
            name: "uk"
            widget: "text"
            required: false
          - label: "English"
            name: "en"
            widget: "text"
            required: false

      - label: "Sort order"
        name: "sort"
        widget: "number"
        default: 10
        value_type: "int"

  - name: "news"
    label: "News Posts"
    label_singular: "News Post"
    folder: "src/content/news"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "title.en"
    summary: "{{title.en}} — {{category}}"
    slug: "{{slug}}"
    media_folder: "public/uploads/news"
    public_folder: "/uploads/news"
    fields:
      - label: "Title"
        name: "title"
        widget: "object"
        fields:
          - label: "Ukrainian"
            name: "uk"
            widget: "string"
          - label: "English"
            name: "en"
            widget: "string"

      - label: "Slug"
        name: "slug"
        widget: "string"
        required: false
        hint: "Optional. If empty, the website generates slug from the post title."

      - label: "Category"
        name: "category"
        widget: "relation"
        collection: "newsCategories"
        search_fields:
          - "title.en"
          - "title.uk"
          - "slug"
        value_field: "slug"
        display_fields:
          - "title.en"

      - label: "Date"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"

      - label: "Main image"
        name: "image"
        widget: "image"
        required: false

      - label: "Excerpt"
        name: "excerpt"
        widget: "object"
        required: false
        fields:
          - label: "Ukrainian"
            name: "uk"
            widget: "text"
            required: false
          - label: "English"
            name: "en"
            widget: "text"
            required: false

      - label: "External redirect URL"
        name: "redirectUrl"
        widget: "string"
        required: false
        hint: "If filled, archive cards will link to this URL instead of a local post page."

      - label: "Open external URL in new tab"
        name: "redirectBlank"
        widget: "boolean"
        default: true

      - label: "Draft"
        name: "draft"
        widget: "boolean"
        default: false

      - label: "SEO title"
        name: "seoTitle"
        widget: "object"
        required: false
        fields:
          - label: "Ukrainian"
            name: "uk"
            widget: "string"
            required: false
          - label: "English"
            name: "en"
            widget: "string"
            required: false

      - label: "SEO description"
        name: "seoDescription"
        widget: "object"
        required: false
        fields:
          - label: "Ukrainian"
            name: "uk"
            widget: "text"
            required: false
          - label: "English"
            name: "en"
            widget: "text"
            required: false

      - label: "Body"
        name: "body"
        widget: "markdown"
        required: false
        buttons:
          - bold
          - italic
          - code
          - link
          - heading-two
          - heading-three
          - bulleted-list
          - numbered-list
          - quote
        editor_components:
          - image
        modes:
          - rich_text
          - raw

  - name: "conferences"
    label: "Conferences"
    label_singular: "Conference"
    folder: "src/content/conferences"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "title.en"
    summary: "{{title.en}}"
    slug: "{{slug}}"
    fields:
      - label: "Slug"
        name: "slug"
        widget: "string"
        hint: "Stable URL-safe ID, for example: international-conference-2026"

      - label: "Title"
        name: "title"
        widget: "object"
        fields:
          - label: "Ukrainian"
            name: "uk"
            widget: "string"

          - label: "English"
            name: "en"
            widget: "string"

      - label: "Short description"
        name: "excerpt"
        widget: "object"
        required: false
        fields:
          - label: "Ukrainian"
            name: "uk"
            widget: "text"
            required: false

          - label: "English"
            name: "en"
            widget: "text"
            required: false

      - label: "Dates"
        name: "schedule"
        widget: "list"
        min: 1
        summary: "{{fields.start}} — {{fields.end}}"
        hint: "Add one item for each date or date range."
        fields:
          - label: "Start date"
            name: "start"
            widget: "datetime"
            date_format: "YYYY-MM-DD"
            time_format: false
            format: "YYYY-MM-DD"

          - label: "End date"
            name: "end"
            widget: "datetime"
            date_format: "YYYY-MM-DD"
            time_format: false
            format: "YYYY-MM-DD"
            required: false
            hint: "Leave empty when the conference takes place on one day."

      - label: "Locations"
        name: "locations"
        widget: "list"
        required: false
        summary: "{{fields.uk}}"
        hint: "Locations remain independent from online, offline or hybrid format."
        fields:
          - label: "Ukrainian"
            name: "uk"
            widget: "string"

          - label: "English"
            name: "en"
            widget: "string"

      - label: "Format"
        name: "format"
        widget: "select"
        default: "offline"
        options:
          - label: "Offline"
            value: "offline"

          - label: "Online"
            value: "online"

          - label: "Hybrid"
            value: "hybrid"

      - label: "Card link"
        name: "linkMode"
        widget: "select"
        default: "internal"
        hint: "Choose whether the archive card opens the local conference page or an external website."
        options:
          - label: "Internal conference page"
            value: "internal"

          - label: "External URL"
            value: "external"

      - label: "External URL"
        name: "externalUrl"
        widget: "string"
        required: false
        hint: "Required when Card link is set to External URL."

      - label: "Open external URL in new tab"
        name: "externalBlank"
        widget: "boolean"
        default: true

      - label: "Additional materials"
        name: "resources"
        widget: "list"
        required: false
        summary: "{{fields.title.en}}"
        hint: "Add links to registration, programmes, maps, tests, reports, videos and other materials."
        fields:
          - label: "Icon"
            name: "icon"
            widget: "select"
            default: "link"
            options:
              - label: "Link"
                value: "link"

              - label: "External link"
                value: "external-link"

              - label: "Map"
                value: "map"

              - label: "Calendar"
                value: "calendar"

              - label: "Registration"
                value: "user-plus"

              - label: "Document"
                value: "file-text"

              - label: "Download"
                value: "download"

              - label: "Programme"
                value: "list"

              - label: "Presentation"
                value: "presentation"

              - label: "Test"
                value: "clipboard-check"

              - label: "Certificate"
                value: "certificate"

              - label: "Video"
                value: "video"

              - label: "YouTube"
                value: "youtube"

              - label: "Photo gallery"
                value: "images"

              - label: "Website"
                value: "globe"

          - label: "Title"
            name: "title"
            widget: "object"
            fields:
              - label: "Ukrainian"
                name: "uk"
                widget: "string"

              - label: "English"
                name: "en"
                widget: "string"

          - label: "URL"
            name: "url"
            widget: "string"

          - label: "Open in new tab"
            name: "newTab"
            widget: "boolean"
            default: true

      - label: "Organizing Committee"
        name: "organizingCommitteeUk"
        widget: "markdown"
        required: false
        hint: "Ukrainian text. The page title is added automatically; use paragraphs and lists, without H1 or H2 headings."
        buttons:
          - bold
          - italic
          - link
          - heading-three
          - bulleted-list
          - numbered-list
          - quote
        editor_components: []
        modes:
          - rich_text
          - raw

      - label: "Organizing Committee (English)"
        name: "organizingCommitteeEn"
        widget: "markdown"
        required: false
        hint: "English text. The page title is added automatically; use paragraphs and lists, without H1 or H2 headings."
        buttons:
          - bold
          - italic
          - link
          - heading-three
          - bulleted-list
          - numbered-list
          - quote
        editor_components: []
        modes:
          - rich_text
          - raw

      - label: "Key speakers"
        name: "keySpeakers"
        widget: "list"
        required: false
        summary: "{{fields.name.uk}}"
        fields:
          - label: "Photo"
            name: "photo"
            widget: "image"
            required: false
          - label: "Name"
            name: "name"
            widget: "object"
            fields:
              - { label: "Ukrainian", name: "uk", widget: "string" }
              - { label: "English", name: "en", widget: "string" }
          - label: "Description"
            name: "description"
            widget: "object"
            fields:
              - { label: "Ukrainian", name: "uk", widget: "text" }
              - { label: "English", name: "en", widget: "text" }

      - label: "Programme by hour"
        name: "programme"
        widget: "list"
        required: false
        summary: "{{fields.day.uk}}"
        hint: "Add a day, then its sessions and breaks. The page shows a separate tab and timeline for each day."
        fields:
          - label: "Conference day"
            name: "day"
            widget: "object"
            fields:
              - { label: "Ukrainian", name: "uk", widget: "string" }
              - { label: "English", name: "en", widget: "string" }
          - label: "Timeline entries"
            name: "items"
            widget: "list"
            summary: "{{fields.start}} — {{fields.title.uk}}"
            fields:
              - label: "Entry type"
                name: "type"
                widget: "select"
                default: "session"
                options:
                  - { label: "Session / entry", value: "session" }
                  - { label: "Break", value: "break" }
              - label: "Start time"
                name: "start"
                widget: "string"
                required: false
                hint: "For example: 09:00"
              - label: "End time"
                name: "end"
                widget: "string"
                required: false
                hint: "Optional. Leave empty for a single time."
              - label: "Title"
                name: "title"
                widget: "object"
                required: false
                fields:
                  - { label: "Ukrainian", name: "uk", widget: "string", required: false }
                  - { label: "English", name: "en", widget: "string", required: false }
              - label: "Description"
                name: "description"
                widget: "object"
                required: false
                fields:
                  - label: "Ukrainian"
                    name: "uk"
                    widget: "markdown"
                    required: false
                    buttons: [bold, italic, link, bulleted-list, numbered-list, quote]
                    editor_components: []
                  - label: "English"
                    name: "en"
                    widget: "markdown"
                    required: false
                    buttons: [bold, italic, link, bulleted-list, numbered-list, quote]
                    editor_components: []

      - label: "Speaker abstracts"
        name: "speakerAbstracts"
        widget: "list"
        required: false
        summary: "{{fields.name.uk}}"
        hint: "Displayed as a two-column list on the conference page."
        fields:
          - label: "Name"
            name: "name"
            widget: "object"
            fields:
              - { label: "Ukrainian", name: "uk", widget: "string" }
              - { label: "English", name: "en", widget: "string" }
          - label: "Description"
            name: "description"
            widget: "object"
            fields:
              - { label: "Ukrainian", name: "uk", widget: "text" }
              - { label: "English", name: "en", widget: "text" }

      - label: "Ukrainian content"
        name: "bodyUk"
        widget: "markdown"
        required: false
        buttons:
          - bold
          - italic
          - code
          - link
          - heading-two
          - heading-three
          - bulleted-list
          - numbered-list
          - quote
        editor_components:
          - image
        modes:
          - rich_text
          - raw

      - label: "English content"
        name: "bodyEn"
        widget: "markdown"
        required: false
        buttons:
          - bold
          - italic
          - code
          - link
          - heading-two
          - heading-three
          - bulleted-list
          - numbered-list
          - quote
        editor_components:
          - image
        modes:
          - rich_text
          - raw

      - label: "Featured"
        name: "featured"
        widget: "boolean"
        default: false
        hint: "Allows the conference to be highlighted later."

      - label: "Draft"
        name: "draft"
        widget: "boolean"
        default: false

      - label: "SEO title"
        name: "seoTitle"
        widget: "object"
        required: false
        fields:
          - label: "Ukrainian"
            name: "uk"
            widget: "string"
            required: false

          - label: "English"
            name: "en"
            widget: "string"
            required: false

      - label: "SEO description"
        name: "seoDescription"
        widget: "object"
        required: false
        fields:
          - label: "Ukrainian"
            name: "uk"
            widget: "text"
            required: false

          - label: "English"
            name: "en"
            widget: "text"
            required: false

